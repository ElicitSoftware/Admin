# =============================================================================
# TEST PROFILE — PostgreSQL Dev Services (Testcontainers) + mock OIDC
# =============================================================================
# This file is only on the test classpath. Every key is %test-scoped so its
# intent is explicit and it never affects dev/prod runs. It makes @QuarkusTest
# boot with NO external services: a throwaway PostgreSQL container (Dev Services)
# and annotation-based OIDC (@TestSecurity / @OidcSecurity) instead of Keycloak.

# -----------------------------------------------------------------------------
# Database: one shared PostgreSQL container for BOTH datasources.
# -----------------------------------------------------------------------------
# The JDBC url/username/password for both the default and `owner` datasources
# are injected at runtime by PostgresTestResource (a QuarkusTestResourceLifecycle-
# Manager that starts a single Testcontainers PostgreSQL and hands the same URL
# to both Agroal pools). Using two datasources against one explicit container
# avoids the Dev Services activation ambiguity (the default datasource was left
# without a URL and deactivated). The container runs as superuser `postgres` so
# the bootstrap migration can CREATE ROLE.

# quarkus.datasource(.owner).devservices.enabled is build-time fixed. PostgresTestResource
# also sets it at "runtime" (from its start() map), which is fine for a single Quarkus
# augmentation but conflicts when @TestProfile forces a second, separate augmentation within
# the same test run (its build-time value would otherwise default to null, then get a runtime
# override that Quarkus rejects). Baking it here keeps every augmentation consistent.
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.owner.devservices.enabled=false

# -----------------------------------------------------------------------------
# Flyway (test): prepend the db/test bootstrap that creates the cross-module
# roles/schemas/tables the Admin migrations assume already exist. Ordering is by
# version (V0.0.0.1 < V0.0.1), not by location list.
# -----------------------------------------------------------------------------
%test.quarkus.flyway.owner.locations=db/migration,db/test
%test.quarkus.flyway.owner.schemas=survey

# -----------------------------------------------------------------------------
# OIDC: boot without Keycloak. tenant-enabled=false keeps the extension loaded
# (so @TestSecurity's OIDC integration and the role augmentor still work) but
# skips the discovery/JWKS call that would hang on the unreachable Keycloak.
# -----------------------------------------------------------------------------
%test.quarkus.oidc.enabled=true
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.discovery-enabled=false
%test.quarkus.oidc.auth-server-url=

# -----------------------------------------------------------------------------
# Mailer: use the built-in mock so invitation/reminder beans never open SMTP.
# `from` is a required property (main config only sets it under %dev), so give
# the test profile a dummy sender address.
# -----------------------------------------------------------------------------
%test.quarkus.mailer.mock=true
%test.quarkus.mailer.from=test@example.org

# -----------------------------------------------------------------------------
# Never build/push a container image during the test lifecycle.
# -----------------------------------------------------------------------------
%test.quarkus.container-image.build=false
%test.quarkus.container-image.push=false

# -----------------------------------------------------------------------------
# Quiet + fast
# -----------------------------------------------------------------------------
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.statistics=false
%test.quarkus.log.level=WARN
