# Configuration file
quarkus.banner.enabled=false

# Build identity, filtered by Maven (see the <resources> block in pom.xml) and shown on the
# System overview.
quarkus.application.version=@project.version@
build.timestamp=@timestamp@

# =============================================================================
# OBSERVABILITY CONFIGURATION
# =============================================================================

# Metrics Configuration
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=${quarkus.micrometer.enabled}
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.otel.metrics.enabled=true
quarkus.otel.metric.export.interval=60

# Health Checks
quarkus.smallrye-health.enabled=${quarkus.micrometer.enabled}
quarkus.smallrye-health.root-path=/q/health

# Enhanced Logging
quarkus.log.level=${LOG_LEVEL:WARN}
quarkus.log.category."io.agroal".min-level=TRACE
quarkus.log.category."io.agroal".level=DEBUG
quarkus.log.category."io.quarkus.http.access-log".level=INFO

# Application logging - controls com.elicitsoftware.* (login/auth debug statements, etc.)
quarkus.log.category."com.elicitsoftware".min-level=DEBUG
quarkus.log.category."com.elicitsoftware".level=${ELICIT_LOG_LEVEL:INFO}

# Authorization mode - OIDC (default) or DATABASE. Controls whether the database
# role fallback (survey.user_roles) is consulted at all, and whether the Edit User
# UI shows its database role-assignment section. Does not affect OIDC-supplied roles.
elicit.authorization.mode=${ELICIT_AUTHORIZATION:OIDC}

# Database Telemetry
quarkus.datasource.jdbc.telemetry=true

# Hibernate Statistics for Performance Monitoring
quarkus.hibernate-orm.statistics=true
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# Micrometer Binders - Enable comprehensive metrics collection
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true

# HTTP Server Metrics Configuration
quarkus.micrometer.binder.http-server.max-uri-tags=100
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*

# HTTP Access Logging
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" %D

# Application Name for Metrics
quarkus.application.name=elicit-admin

# Database Metrics
quarkus.datasource.metrics.enabled=${quarkus.micrometer.enabled}

# Vaadin
quarkus.index-dependency.elicit.group-id=com.elicitsoftware
quarkus.index-dependency.elicit.artifact-id=elicit-api

# CORS
# No cross-origin browser caller is known to exist (each Elicit app is served same-origin
# to its own UI); origins must be explicitly listed per deployment via CORS_ALLOWED_ORIGINS.
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-max-age=1h
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:}
# 2026-09 audit: quarkus.tls.trust-all=true is deliberately kept enabled (global outbound
# TLS certificate verification disabled) per explicit sign-off - do not "fix" this without
# re-confirming with the team, since it was a conscious accepted-risk decision, not an oversight.
quarkus.tls.trust-all=true

# OIDC Configuration - Provider agnostic (configured via deployment env vars)
# Override these in deployment:
# quarkus.oidc.auth-server-url
# quarkus.oidc.client-id=
# quarkus.oidc.credentials.secret

# Defaults for local development with Keycloak
quarkus.oidc.auth-server-url=http://host.docker.internal:8180/realms/elicit/
quarkus.oidc.client-id=elicit-admin
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}

# Accept both web flows (UI) and Bearer tokens (API)
quarkus.oidc.application-type=hybrid
quarkus.oidc.authentication.redirect-path=/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/

#Proxy/forwarding configuration for HTTPS redirect URIs
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# HTTP Security Configuration  
# Note: Permissions are evaluated in declaration order (most specific first)
# Allow logout to be public
quarkus.http.auth.permission.logout.paths=/logout
quarkus.http.auth.permission.logout.policy=permit

# Allow /q/health/ to be public
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit

# Allow /q/metrics to be public (Prometheus scraping)
quarkus.http.auth.permission.metrics.paths=/q/metrics
quarkus.http.auth.permission.metrics.policy=permit

# Allow brand static resources to be public
brand.file.system.path=/brand
quarkus.http.auth.permission.brand.paths=/api/brand/*
quarkus.http.auth.permission.brand.policy=permit

# Allow test endpoint to be public
quarkus.http.auth.permission.test.paths=/api/secured/test
quarkus.http.auth.permission.test.policy=permit

# Allow PDF download endpoint to be public to avoid OIDC redirect flow on new tabs
quarkus.http.auth.permission.pdf.paths=/api/pdf/*
quarkus.http.auth.permission.pdf.policy=permit

# All other paths require authentication - OIDC will handle redirects
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Upload size cap - no endpoint in this app expects a body larger than a CSV/Elicit-format
# import file; bounds unbounded multipart streaming in RespondentImportResource /
# SurveyDefinitionImportResource / AccessCodeService#importCsv.
quarkus.http.limits.max-body-size=25M

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=17
quarkus.datasource.jdbc.url=jdbc:postgresql://db:5432/survey?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.leak-detection-interval=10m
quarkus.datasource.jdbc.metrics.enabled=${quarkus.micrometer.enabled}
quarkus.datasource.username=surveyadmin_user
quarkus.datasource.password=${ELICIT_DB_PASSWORD}
quarkus.hibernate-orm.packages=com.elicitsoftware.model
quarkus.hibernate-orm.fetch.batch-size=16

# Datasource owner
quarkus.datasource.owner.db-kind=postgresql
quarkus.datasource.owner.db-version=17
quarkus.datasource.owner.jdbc.url=jdbc:postgresql://db:5432/survey?connectTimeout=30&socketTimeout=600&tcpKeepAlive=true&tcpKeepAlivesIdle=60
quarkus.datasource.owner.jdbc.min-size=2
quarkus.datasource.owner.jdbc.max-size=10
quarkus.datasource.owner.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.owner.jdbc.leak-detection-interval=10m
quarkus.datasource.owner.jdbc.metrics.enabled=${quarkus.micrometer.enabled}
quarkus.datasource.owner.username=elicit_owner
quarkus.datasource.owner.password=${ELICIT_OWNER_DB_PASSWORD}
quarkus.datasource.owner.jdbc.transaction-isolation-level=serializable

#Flyway
quarkus.flyway.owner.schemas=survey
quarkus.flyway.owner.migrate-at-start=true
quarkus.flyway.owner.baseline-on-migrate=true
quarkus.flyway.owner.validate-on-migrate=true
# V0.0.3 was edited after it had already been applied in existing deployments (its
# user_surveys inserts are now conditional so a fresh, survey-less database can start).
# V0.0.1 and V0.0.7 were likewise edited so the survey.status view selects
# respondents.access_code (renamed from token by Survey's V014).
# With validate-on-migrate=true those checksum changes would fail startup on those
# installs; repairing at start rewrites the recorded checksums instead of requiring a
# manual `flyway repair`. Safe to remove once every deployment has started once on
# V0.0.18 or later.
quarkus.flyway.owner.repair-at-start=true
quarkus.flyway.owner.baseline-version=0
quarkus.flyway.owner.baseline-description=Empty Database
quarkus.flyway.owner.connect-retries=10
quarkus.flyway.owner.table=flyway_admin_history
quarkus.flyway.owner.placeholders.surveyadmin_user=surveyadmin_user
quarkus.flyway.owner.placeholders.survey_user=survey_user
quarkus.flyway.owner.placeholders.surveyadmin_owner=elicit_owner
quarkus.flyway.owner.locations=db/migration,db/dev

# HTTP Headers
quarkus.http.header."Strict-Transport-Security".path=/api/*
quarkus.http.header."Strict-Transport-Security".methods=POST,GET,OPTIONS,DELETE,PUT
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains;

# Packaging - exclude Vaadin config from app jar (use the one in generated-bytecode.jar)
quarkus.package.jar.user-configured-ignored-entries=META-INF/VAADIN/config/flow-build-info.json

# Default Image
# build/push are off by default so a plain `mvn package`/`verify`/`install` never touches
# Docker Hub. The release pipeline (.github/workflows/maven.yml) passes -Dquarkus.container-image.*
# explicitly, and the local docker-build scripts activate the %docker profile below - neither
# depends on these base defaults.
quarkus.container-image.tag=latest
quarkus.container-image.registry=docker.io
quarkus.container-image.group=elicitsoftware
quarkus.container-image.name=admin
quarkus.container-image.build=false
quarkus.container-image.push=false

# =============================================================================
# %dev - Local Development
# =============================================================================
# for local network testing.
#quarkus.http.host=0.0.0.0
%dev.quarkus.http.port=8081
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."com.elicitsoftware".level=DEBUG
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/elicit/
%dev.quarkus.oidc.credentials.secret=secret
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true
%dev.quarkus.transaction-manager.default-transaction-timeout=300
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5452/survey
%dev.quarkus.datasource.owner.jdbc.url=jdbc:postgresql://localhost:5452/survey
%dev.quarkus.datasource.password=SAOWNERPW
%dev.quarkus.datasource.owner.password=SURVEYPW

# Setup a simple SMTP connection.
# If you need to track delivery you can use a service like SendGrid.
# For configuration options see https://quarkus.io/guides/mailer-reference#popular
%dev.quarkus.mailer.from=elicit@localhost
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.tls=false
#%dev.quarkus.mailer.auth-methods=
#%dev.quarkus.mailer.username=
#%dev.quarkus.mailer.password=

# =============================================================================
