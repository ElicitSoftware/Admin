# =============================================================================
# %docker
# =============================================================================
%docker.quarkus.container-image.push=false
%docker.quarkus.container-image.build=true

# =============================================================================
# %prod
# =============================================================================
# No %prod-specific overrides yet - production uses the common defaults above
# (docker-network datasource URLs, container-image settings, etc.). Add
# %prod.* entries here as they're needed rather than back in the common block.
