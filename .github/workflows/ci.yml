# Runs the regression suite (unit + booted @QuarkusTest, JaCoCo coverage gate) on every
# pull request and every push to main. This is the gate that actually enforces tests pass
# before code merges — the release workflow (maven.yml) skips tests entirely and only runs
# at tag-push time, so without this workflow nothing ever ran the suite in CI.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Fetch the deployment translations from the umbrella repository
        # The language tests read ../elicit-i18n, exactly as the dev and test profiles do in a
        # local umbrella checkout (the application itself ships English only). Prefer the umbrella
        # branch with the same name as this one, so a cross-repo change can be tested before merge.
        run: |
          UMBRELLA=https://github.com/ElicitSoftware/Elicit.git
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          REF=()
          if git ls-remote --exit-code --heads "$UMBRELLA" "$BRANCH" >/dev/null 2>&1; then
            REF=(--branch "$BRANCH")
          fi
          git clone --depth 1 --filter=blob:none --sparse "${REF[@]}" "$UMBRELLA" "$RUNNER_TEMP/elicit"
          git -C "$RUNNER_TEMP/elicit" sparse-checkout set elicit-i18n
          ln -s "$RUNNER_TEMP/elicit/elicit-i18n" ../elicit-i18n
          ls ../elicit-i18n/

      - name: Build and run tests
        run: mvn -B clean verify
