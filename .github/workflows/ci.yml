# Runs the regression suite (unit + booted @QuarkusTest, JaCoCo coverage gate) on every
# pull request into a long-lived branch and every push to one. This is the gate that actually
# enforces tests pass before code merges — the release workflow (maven.yml) skips tests
# entirely and only runs at tag-push time, so without this workflow nothing ever ran the suite
# in CI.
#
# Both main and i18n are gated. i18n is a long-lived line many commits ahead of main, and it is
# where the current work merges; while only main was gated, every pull request into i18n was
# merged without being compiled, let alone tested.

name: CI

on:
  push:
    branches:
      - main
      - i18n
  pull_request:
    branches:
      - main
      - i18n

jobs:
  test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B clean verify
