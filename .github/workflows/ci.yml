# Runs the regression suite (unit + booted @QuarkusTest, JaCoCo coverage gate) on every
# pull request into a long-lived branch and every push to one. This is the gate that actually
# enforces tests pass before code merges — the release workflow (maven.yml) skips tests
# entirely and only runs at tag-push time, so without this workflow nothing ever ran the suite
# in CI.
#
# Both main and V3 are gated. V3 is a long-lived line many commits ahead of main, and it is
# where the current work merges; while only main was gated, every pull request into the line
# ahead of it was merged without being compiled, let alone tested.

name: CI

on:
  push:
    branches:
      - main
      - V3
  pull_request:
    branches:
      - main
      - V3

jobs:
  test:
    name: Build and Test with Maven
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Fetch the curated translations from the umbrella repository
        # The image carries English only; the language tests read the other languages from
        # ../elicit-i18n, exactly as the dev and test profiles do in a local umbrella checkout.
        # Prefer the umbrella branch with the same name as this one, so a cross-repo change can be
        # tested before merge; otherwise the umbrella's default branch.
        run: |
          UMBRELLA=https://github.com/ElicitSoftware/Elicit.git
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          REF=()
          if git ls-remote --exit-code --heads "$UMBRELLA" "$BRANCH" >/dev/null 2>&1; then
            REF=(--branch "$BRANCH")
          fi
          git clone --depth 1 --filter=blob:none --sparse "${REF[@]}" "$UMBRELLA" "$RUNNER_TEMP/elicit"
          git -C "$RUNNER_TEMP/elicit" sparse-checkout set elicit-i18n
          ln -s "$RUNNER_TEMP/elicit/elicit-i18n" ../elicit-i18n
          ls ../elicit-i18n/

      - name: Build and run tests
        run: mvn -B clean verify
